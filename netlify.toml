[build]
  # 빌드 명령어 없음 (정적 HTML 파일)
  command = ""
  # 배포할 디렉토리 (루트 디렉토리)
  publish = "."

# 리디렉션 설정 (SPA가 아니므로 불필요하지만 추가)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# 헤더 설정
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
